spring:
  application:
    name: spring-ai-app

  # No compose.yaml yet; flip to true once one exists for ChromaDB (RAG examples)
  docker:
    compose:
      enabled: false

  ai:
    # Chat: all providers stay active (ChatClients are built in ModelConfig).
    # Embedding: only one may be active, since the Chroma vector store needs a single EmbeddingModel.
    model:
      embedding: ollama

    # ---------- ChromaDB (vector store) ----------
    vectorstore:
      chroma:
        client:
          host: http://localhost
          port: 8000
        initialize-schema: true   # create the collection on startup if missing
        # Spring AI's default tenant/database don't exist on the Chroma 1.x server and the client
        # fails to create them, so use the ones Chroma ships with.
        tenant-name: default_tenant
        database-name: default_database

    # ---------- Ollama (local, default provider) ----------
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: gemma2:2b
          temperature: 0.7
      init:
        pull-model-strategy: when_missing

    # ---------- OpenAI (cloud) ----------
    openai:
      api-key: ${OPENAI_API_KEY:sk-demo-placeholder}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

    # ---------- Hugging Face (dedicated Inference Endpoint) ----------
    huggingface:
      chat:
        api-key: ${HUGGINGFACE_API_KEY:hf_demo_placeholder}
        url: ${HUGGINGFACE_ENDPOINT_URL:https://your-endpoint.endpoints.huggingface.cloud}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.ai: DEBUG